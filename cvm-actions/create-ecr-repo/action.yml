name: 'Create ECR Repository with Lifecycle Policy'
description: 'Creates an ECR repository (if it does not exist) and applies a CVM standard lifecycle policy'

inputs:
  repository:
    description: 'ECR repository name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Write ECR lifecycle policy
      shell: bash
      run: |
        cat > "${{ runner.temp }}/ecr-lifecycle-policy.json" << EOF
        {
          "rules": [
            {
              "rulePriority": 1,
              "description": "Keep all prod tagged images",
              "selection": {
                "tagStatus": "tagged",
                "tagPrefixList": ["prod"],
                "countType": "imageCountMoreThan",
                "countNumber": 99999
              },
              "action": {
                "type": "expire"
              }
            },
            {
              "rulePriority": 2,
              "description": "Keep all sb tagged images",
              "selection": {
                "tagStatus": "tagged",
                "tagPrefixList": ["sb"],
                "countType": "imageCountMoreThan",
                "countNumber": 99999
              },
              "action": {
                "type": "expire"
              }
            },
            {
              "rulePriority": 3,
              "description": "Expire everything else after 10 days",
              "selection": {
                "tagStatus": "any",
                "countType": "sinceImagePushed",
                "countUnit": "days",
                "countNumber": 10
              },
              "action": {
                "type": "expire"
              }
            }
          ]
        }
        EOF

    - name: Create ECR repository if it doesn't exist
      uses: int128/create-ecr-repository-action@v1
      with:
        repository: ${{ inputs.repository }}
        lifecycle-policy: ${{ runner.temp }}/ecr-lifecycle-policy.json
